# One of HonorCat's three independent early-payout samplers (the others: the Vercel app and a local
# machine). It reads Gemini's public order book over WebSocket, applies the trigger rule itself and
# signs only what its own data shows. Runs when pots are armed; exits quickly when none are.
name: sampler

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: sampler
  cancel-in-progress: false

permissions:
  contents: read

env:
  API: https://honorcat.vercel.app

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Any armed pots?
        id: check
        run: |
          n=$(curl -sf "$API/api/early/armed" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["pots"]))' || echo 0)
          echo "armed=$n" >> "$GITHUB_OUTPUT"
          echo "armed pots: $n"
      - uses: actions/checkout@v4
        if: steps.check.outputs.armed != '0' || github.event_name == 'workflow_dispatch'
      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.armed != '0' || github.event_name == 'workflow_dispatch'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.armed != '0' || github.event_name == 'workflow_dispatch'
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        if: steps.check.outputs.armed != '0' || github.event_name == 'workflow_dispatch'
        run: pnpm install --frozen-lockfile --filter "@honorcat/relay..."
      - name: Sample until no pot is armed (or 5.5 h)
        if: steps.check.outputs.armed != '0' || github.event_name == 'workflow_dispatch'
        working-directory: relay
        env:
          SAMPLER_KEY_GITHUB: ${{ secrets.SAMPLER_KEY_GITHUB }}
        run: pnpm exec tsx scripts/sampler.ts --api "$API" --key-env SAMPLER_KEY_GITHUB --idle-exit 600 --max 19800
